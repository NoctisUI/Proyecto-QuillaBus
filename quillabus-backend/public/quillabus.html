<style>
:root{--bg:#eaf1ed;--cd:#fff;--ink:#10201a;--mut:#5d7068;--g:#00573F;--g2:#003E2D;--go:#B8860B;--ln:#d5e0da;--mp:#dfe9e3;--rd:#c9d6ce;--rj:#C0392B;--ok:#e3f2ea;--okt:#00573F;--warn:#fbe5d0;--warnt:#a4530c;--sh:0 10px 30px #003e2d12;--r:18px}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1511;--cd:#15231d;--ink:#e6f0ea;--mut:#8fa59b;--g:#1f8a64;--g2:#0f4a38;--go:#e0a82e;--ln:#243a31;--mp:#102019;--rd:#1d3228;--rj:#e0584a;--ok:#173a2b;--okt:#6fd9aa;--warn:#3a2b17;--warnt:#f0bd73;--sh:0 10px 30px #0006}}
:root[data-theme="dark"]{--bg:#0c1511;--cd:#15231d;--ink:#e6f0ea;--mut:#8fa59b;--g:#1f8a64;--g2:#0f4a38;--go:#e0a82e;--ln:#243a31;--mp:#102019;--rd:#1d3228;--rj:#e0584a;--ok:#173a2b;--okt:#6fd9aa;--warn:#3a2b17;--warnt:#f0bd73;--sh:0 10px 30px #0006}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 Figtree,system-ui,-apple-system,sans-serif;min-height:100dvh;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}

:focus-visible{outline:3px solid var(--go);outline-offset:2px}
img{max-width:100%}
#app{max-width:440px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg)}
#app.wide{max-width:1080px}
.hd{background:linear-gradient(165deg,var(--g2),var(--g));color:#fff;padding:calc(16px + env(safe-area-inset-top,0px)) 20px 48px;border-radius:0 0 30px 30px;position:relative;overflow:hidden}
.hd::after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:#ffffff10;right:-90px;top:-80px;pointer-events:none}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px;position:relative;z-index:1}
.brand{font-weight:800;font-size:20px;display:flex;align-items:center;gap:8px}
.brand::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--go);display:inline-block;transform:rotate(45deg)}
.acciones{display:flex;gap:7px;align-items:center;position:relative;z-index:1}
.gh{background:#ffffff26;color:#fff;border:1px solid #ffffff2e;border-radius:99px;padding:8px 13px;font-weight:600;font-size:14px;min-height:40px;transition:background .15s}
.gh:hover{background:#ffffff38}
.gh.icon{padding:8px 11px}
.hd h1{font-size:clamp(25px,7.2vw,33px);line-height:1.1;font-weight:800;position:relative;z-index:1}

main{flex:1;padding:0 16px calc(96px + env(safe-area-inset-bottom,0px));margin-top:-30px;display:flex;flex-direction:column;gap:12px;position:relative;z-index:1}

.card{background:var(--cd);border:1px solid var(--ln);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.card.flat{box-shadow:none}
.card h2,.card h3{font-size:19px;line-height:1.2;margin-bottom:4px}

.row>div>b,.row>div>.big{display:block}
.row.wrap{flex-wrap:wrap}
.row.start{justify-content:flex-start}
.col{display:flex;flex-direction:column;gap:10px}
small,.mut{color:var(--mut);font-size:13px}

.big{font-size:clamp(42px,12vw,56px);line-height:1;font-weight:800;color:var(--g)}
.badge,.bg{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:700;background:var(--ok);color:var(--okt);white-space:nowrap}
.bg.gr{background:var(--ln);color:var(--mut)}
.bg.or{background:var(--warn);color:var(--warnt)}
.bg.rd{background:#f8d7d3;color:#8f1e13}
:root[data-theme="dark"] .bg.rd{background:#4a211d;color:#ff9e92}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .bg.rd{background:#4a211d;color:#ff9e92}}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}

.ch{flex:0 0 auto;min-height:44px;padding:0 15px;border-radius:13px;border:2px solid var(--ln);background:var(--cd);font-weight:700;font-size:14px;transition:transform .12s,border-color .12s}
.ch:active{transform:scale(.97)}
.ch.on{background:var(--c,var(--g));border-color:var(--c,var(--g));color:#fff}
.ch .dot{background:currentColor;width:7px;height:7px}
select,input,textarea{width:100%;min-height:48px;border-radius:12px;border:1.5px solid var(--ln);background:var(--bg);padding:10px 12px;transition:border-color .15s}
select:focus,input:focus,textarea:focus{border-color:var(--g);outline:none;box-shadow:0 0 0 3px #00573f1f}

textarea{resize:vertical;min-height:90px}
label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
.row select{width:auto;max-width:200px;min-width:130px}
.pb{min-height:48px;border:0;border-radius:13px;background:var(--g);color:#fff;font-weight:700;padding:0 16px;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:filter .15s,transform .12s}
.pb:hover{filter:brightness(1.08)}
.pb:active{transform:scale(.98)}
.pb:disabled{background:var(--ok);color:var(--okt);cursor:not-allowed;filter:none}
.pb.sm{min-height:38px;font-size:13.5px;padding:0 12px;border-radius:10px}
.pb.ou{background:transparent;border:2px solid var(--g);color:var(--g)}
.pb.ou:disabled{border-color:var(--ln);color:var(--mut);background:transparent}
.pb.go{background:var(--go)}
.pb.rj{background:var(--rj)}
.pb.ghost{background:transparent;border:1.5px solid var(--ln);color:var(--ink)}
.pb.block{width:100%}
.icon-btn{background:none;border:0;min-width:44px;min-height:44px;color:var(--go);font-size:22px;display:inline-grid;place-items:center;border-radius:10px}
.icon-btn:hover{background:var(--bg)}
.link{background:none;border:0;color:var(--g);font-weight:700;padding:4px;font-size:13.5px;min-height:32px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

.empty{border:1.5px dashed var(--ln);border-radius:var(--r);padding:22px 16px;text-align:center;color:var(--mut);font-size:14px;background:var(--cd)}
.notice{display:flex;gap:10px;align-items:flex-start;background:var(--warn);color:var(--warnt);border-radius:13px;padding:12px 14px;font-size:13.5px;font-weight:600}
.notice.ok{background:var(--ok);color:var(--okt)}
.notice.rd{background:#f8d7d3;color:#8f1e13}

:root[data-theme="dark"] .notice.rd{background:#4a211d;color:#ff9e92}
.sep{border:0;border-top:1px solid var(--ln);margin:2px 0}
.nv{position:sticky;bottom:0;z-index:500;display:flex;background:var(--cd);border-top:1px solid var(--ln);padding:6px 6px calc(8px + env(safe-area-inset-bottom,0px));max-width:440px;margin:0 auto;width:100%}
.nv button{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:var(--mut);font-size:11.5px;font-weight:600;min-height:56px;border-radius:12px;padding:5px 2px}
.nv button.on{color:var(--g);background:var(--ok)}
.nv svg{width:22px;height:22px}
.nv .bd{position:absolute;top:3px;right:calc(50% - 24px);background:var(--go);color:#fff;border-radius:99px;font-size:10px;font-style:normal;padding:1px 6px;font-weight:800}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none;position:sticky;top:0;z-index:450;background:var(--bg)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;min-height:40px;padding:0 14px;border-radius:11px;border:1.5px solid var(--ln);background:var(--cd);font-weight:600;font-size:13.5px;white-space:nowrap}
.tab.on{background:var(--g);color:#fff;border-color:var(--g)}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}
.kp .card b{font-size:32px;font-family:"Bricolage Grotesque",sans-serif;display:block;line-height:1.1;margin-top:4px}
.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:12px;align-items:start}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.tw{overflow-x:auto;margin:0 -4px;padding:0 4px}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:540px}
th{text-align:left;color:var(--mut);font-weight:600;padding:8px 7px;white-space:nowrap;border-bottom:1px solid var(--ln)}
td{padding:11px 7px;border-top:1px solid var(--ln);vertical-align:middle}
td .pb{margin:2px 3px 2px 0}
td select{min-height:36px;padding:5px 8px;font-size:13px;min-width:118px}
.tw+.tw{margin-top:8px}
.mapa-card{padding:0;overflow:hidden;position:relative}
.mapa-head{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--ln)}
.mapa-head b{display:block;font-size:15.5px;line-height:1.25}
.mapa-head small{display:block;margin-top:2px}
.mapbox{height:clamp(280px,46vh,430px);width:100%;background:var(--mp);z-index:0}
.mapa-error{height:100%;display:grid;place-items:center;text-align:center;padding:24px;color:var(--mut);font-size:14px}
.mapa-foot{padding:9px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;color:var(--mut);border-top:1px solid var(--ln)}
.leaflet-container{font:inherit;background:var(--mp)}
.leaflet-control-attribution{font-size:10px!important}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--cd);color:var(--ink)}
.leaflet-popup-content{font-size:13px;line-height:1.4;margin:10px 12px}
.pin-bus{width:34px;height:34px;border-radius:50%;background:var(--c,#00573F);color:#fff;display:grid;place-items:center;font-size:15px;border:3px solid #fff;box-shadow:0 3px 10px #0005}
.pin-parada{width:16px;height:16px;border-radius:50%;background:#fff;border:4px solid var(--c,#00573F);box-shadow:0 1px 4px #0006;transition:transform .15s}
.pin-parada.sel{width:22px;height:22px;border-color:var(--go);background:var(--go);box-shadow:0 0 0 5px #b8860b33}
.pin-user{width:20px;height:20px;border-radius:50%;background:#2fbf7f;border:4px solid #fff;box-shadow:0 0 0 7px #2fbf7f33,0 2px 6px #0005;animation:pl 1.6s infinite}
@keyframes pl{50%{box-shadow:0 0 0 12px #2fbf7f00,0 2px 6px #0005}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
.ts{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(8px);background:var(--g2);color:#fff;border-radius:14px;padding:12px 16px;max-width:min(90vw,420px);font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:1200;box-shadow:0 8px 30px #0004;text-align:center}
.ts.on{opacity:1;transform:translateX(-50%) translateY(0)}
.ts.err{background:var(--rj)}
.ts.ok{background:var(--g)}
.modal{position:fixed;inset:0;background:#00150e99;backdrop-filter:blur(3px);z-index:1000;display:flex;align-items:flex-end;justify-content:center;padding:14px}
.modal[hidden]{display:none}
.modal-card{background:var(--cd);border:1px solid var(--ln);border-radius:22px;max-width:600px;width:100%;max-height:88dvh;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 24px 80px #0006}
@media(min-width:700px){.modal{align-items:center}}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:-18px;background:var(--cd);padding:6px 0;z-index:2;border-bottom:1px solid var(--ln)}
.modal-head h2{font-size:21px}
.modal-head button{background:none;border:0;font-size:28px;min-width:44px;min-height:44px;color:var(--mut);border-radius:10px}
.check-list{max-height:300px;overflow:auto;display:grid;gap:3px;background:var(--bg);border:1px solid var(--ln);border-radius:12px;padding:7px}
.check-list label{flex-direction:row;align-items:center;font-weight:500;padding:8px;border-radius:8px;cursor:pointer;font-size:14px}
.check-list label:hover{background:var(--cd)}
.check-list small{margin-left:auto}
.skel{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--ln),var(--bg),var(--ln));background-size:200% 100%;animation:sh 1.4s infinite}
@keyframes sh{to{background-position:-200% 0}}
.auth{max-width:440px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:calc(26px + env(safe-area-inset-top,0px)) 18px calc(30px + env(safe-area-inset-bottom,0px));gap:14px;background:var(--bg)}
.auth-logo{font-size:44px;font-weight:800;color:var(--g);line-height:1;letter-spacing:-.04em}
.auth-logo span{color:var(--go)}
.auth .lead{font-size:15px;color:var(--mut);max-width:34ch;margin-top:-4px}
.auth-card{background:var(--cd);border:1px solid var(--ln);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:13px;box-shadow:var(--sh)}
.seg{display:flex;background:var(--ln);border-radius:13px;padding:4px}
.seg button{flex:1;min-height:42px;border:0;border-radius:10px;background:none;font-weight:600;font-size:14px}
.seg .on{background:var(--g);color:#fff}
.demo{display:flex;gap:6px;flex-wrap:wrap}
.demo button{border:1px solid var(--ln);background:var(--bg);border-radius:99px;padding:6px 11px;font-size:12px;font-weight:600;min-height:34px}
.demo button:hover{border-color:var(--g)}
.auth-foot{text-align:center;font-size:12px;color:var(--mut);line-height:1.5}
.gps{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13.5px}
.gps i{width:10px;height:10px;border-radius:50%;background:#2fbf7f;animation:pl2 1.2s infinite;flex:none}
.gps.off i{background:var(--mut);animation:none}
.gps.bad i{background:var(--rj);animation:none}
@keyframes pl2{50%{opacity:.3}}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13.5px}
.kv dt{color:var(--mut)}
.kv dd{font-weight:600;text-align:right;overflow-wrap:anywhere}
details summary{cursor:pointer;font-weight:700;font-size:13.5px;color:var(--g);padding:6px 0;min-height:34px}
details[open] summary{margin-bottom:4px}
.stop-list{display:grid;gap:2px}
.stop-item{display:flex;align-items:center;gap:9px;padding:8px 4px;border-top:1px solid var(--ln);font-size:13.5px}
.stop-item .n{width:23px;height:23px;border-radius:50%;background:var(--ok);color:var(--okt);display:grid;place-items:center;font-size:11px;font-weight:800;flex:none}
.stop-item button{background:none;border:0;text-align:left;flex:1;min-height:36px;font-weight:500}
.stop-item .eta{margin-left:auto;color:var(--mut);font-size:12px;white-space:nowrap}
.progress{height:4px;border-radius:99px;background:var(--ln);overflow:hidden}
.progress i{display:block;height:100%;background:var(--go);border-radius:99px;transition:width .5s}
</style>
</head>
<body>

<div id="app"></div>
<div id="toast" class="ts" role="status" aria-live="polite"></div>
<div id="modal" class="modal" hidden></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/firebase-config.js"></script>
<script>
'use strict';

const $ = (s, raiz = document) => raiz.querySelector(s);
const $$ = (s, raiz = document) => [...raiz.querySelectorAll(s)];
const app = document.getElementById('app');
const Estado = {
  sesion: null,
  loginModo: 'login',
  tab: 'mapa',
  rutaSel: null,
  paradaSel: null,
  minutosAntes: 3,
  busqueda: '',
  rutas: [],
  paradasPorRuta: {},
  paradasMap: {},
  avisos: [],
  favoritos: [],
  alertas: [],
  buses: [],
  eta: [],
  ultimaAct: null,
  cargando: false,
  admin: { tab: 'resumen', resumen: null, rutas: [], paradas: [], buses: [], conductores: [], avisos: [], cargando: false, error: null },
  conductor: { recorrido: null, buses: [], rutas: [], gps: { watchId: null, pos: null, error: null, ultimoEnvio: null, enviando: false } }
};
const ICONOS = {
  mapa: 'M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14',
  rutas: 'M6 3.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM18 15.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM6 8.5v3c0 4 12 1 12 4',
  alertas: 'M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15zM10 21h4',
  avisos: 'M4 5h13v14H6a2 2 0 0 1-2-2zM17 9h3v8a2 2 0 0 1-2 2M8 9h5M8 13h5',
  bus: 'M5 4h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zM3 11h18M7 20v-3M17 20v-3M7 14h.01M17 14h.01',
  pin: 'M12 21s7-5.5 7-11a7 7 0 1 0-14 0c0 5.5 7 11 7 11zM12 12a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z'
};
const icono = n => `<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${ICONOS[n] || ICONOS.mapa}"/></svg>`;
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rolTexto = r => ({ ESTUDIANTE: 'Estudiante', CONDUCTOR: 'Conductor', ADMIN: 'Administrador' }[r] || r || '');
const fecha = v => { if (!v) return '—'; const d = new Date(v); return isNaN(d) ? '—' : d.toLocaleDateString('es-CO', { day: '2-digit', month: 'short', year: 'numeric' }); };
const hora = v => { if (!v) return '—'; const d = new Date(v); return isNaN(d) ? '—' : d.toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit', second: '2-digit' }); };
const fechaHora = v => !v ? '—' : `${fecha(v)} · ${hora(v)}`;
const desde = v => {
  if (!v) return '—';
  const s = Math.max(0, Math.round((Date.now() - new Date(v)) / 1000));
  if (s < 10) return 'ahora';
  if (s < 60) return `hace ${s} s`;
  if (s < 3600) return `hace ${Math.floor(s / 60)} min`;
  return `hace ${Math.floor(s / 3600)} h`;
};
const minTexto = m => {
  if (m === null || m === undefined || Number.isNaN(Number(m))) return '—';
  return Number(m) < 1 ? 'Ya llega' : `${Math.ceil(Number(m))} min`;

  if (res.status === 204) return null;

  if (geoCache.has(ruta.id)) return geoCache.get(ruta.id);
  const ps = Estado.paradasPorRuta[ruta.id] || [];
  const fallback = ps.map(p => [p.latitud, p.longitud]);
  if (ps.length < 2) return fallback;
  try {
    const url = 'https://router.project-osrm.org/route/v1/driving/' + ps.map(p => `${p.longitud},${p.latitud}`).join(';') + '?overview=full&geometries=geojson';
    const res = await fetch(url, { headers: { Accept: 'application/json' } });
    if (!res.ok) throw new Error('OSRM');
    const data = await res.json();
    const c = data && data.routes && data.routes[0] && data.routes[0].geometry && data.routes[0].geometry.coordinates;
    if (Array.isArray(c) && c.length > 1) {
      const ll = c.map(([lon, lat]) => [lat, lon]);
      geoCache.set(ruta.id, ll);
      return ll;
    }
  } catch { }
  return fallback;
}

  if (!window.L) { cont.innerHTML = '<div class="mapa-error">No se pudo cargar el mapa. El GPS sigue enviando la ubicación.</div>'; return; }
  const ps = Estado.paradasPorRuta[r.ruta_id] || [];
  if (mapaConductor) { quitarMapa(mapaConductor); mapaConductor = null; }
  const centro = ps.length ? [ps[0].latitud, ps[0].longitud] : [10.9878, -74.7889];
  mapaConductor = L.map(cont, { zoomControl: true, zoomAnimation: false, fadeAnimation: false }).setView(centro, 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' }).addTo(mapaConductor);
  const coords = ps.map(p => [p.latitud, p.longitud]);
  capaConductor = L.layerGroup().addTo(mapaConductor);
  if (coords.length > 1) {
    const linea = L.polyline(coords, { color: r.color || '#00573F', weight: 5, opacity: .85 }).addTo(mapaConductor);
    mapaConductor.fitBounds(linea.getBounds(), { padding: [28, 28] });
    geometriaRuta({ id: r.ruta_id }).then(ll => {
      if (mapaConductor && ll && ll.length > 1 && Estado.conductor.recorrido && Estado.conductor.recorrido.ruta_id === r.ruta_id) {
        linea.setLatLngs(ll);
        mapaConductor.fitBounds(linea.getBounds(), { padding: [28, 28] });
      }
    }).catch(() => { });
  }
  ps.forEach((p, i) => {
    L.circleMarker([p.latitud, p.longitud], { radius: 5, color: r.color || '#00573F', fillColor: '#fff', fillOpacity: 1, weight: 3 })
      .addTo(capaConductor).bindTooltip(`${i + 1}. ${p.nombre}`);
  });
  actualizarMapaConductor();
}
function actualizarMapaConductor() {
  if (!mapaConductor) return;
  const g = Estado.conductor.gps, r = Estado.conductor.recorrido;
  if (!g.pos || !r) return;
  const ll = [g.pos.lat, g.pos.lng];
  if (!marcadorConductor) {
    marcadorConductor = L.marker(ll, { icon: iconoBus(r.color || '#00573F'), zIndexOffset: 2000, title: 'Tu bus' }).addTo(mapaConductor);
    mapaConductor.panTo(ll);

}
function iniciarGPSConductor() {
  const g = Estado.conductor.gps;
  if (!Estado.conductor.recorrido) return;
  if (!('geolocation' in navigator)) { g.error = 'Este dispositivo o navegador no soporta geolocalización.'; actualizarGPSDOM(); return; }
  if (!window.isSecureContext) { g.error = 'El GPS requiere HTTPS o localhost. Abre la URL publicada de la app.'; actualizarGPSDOM(); return; }
  if (g.watchId !== null) return;
  g.error = null;
  try {
    g.watchId = navigator.geolocation.watchPosition(pos => {
      g.pos = { lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy, speed: pos.coords.speed || 0, ts: Date.now() };
      g.error = null;
      actualizarGPSDOM();
      actualizarMapaConductor();
      if (!g.ultimoEnvio) enviarUbicacion();
    }, err => {
      g.error = err.code === 1 ? 'Permiso de ubicación denegado. Actívalo en los ajustes del navegador y pulsa Reintentar GPS.' :
        err.code === 2 ? 'No se pudo obtener la ubicación. Verifica que el GPS esté encendido.' :
          'La ubicación tardó demasiado. Busca un lugar con mejor señal e inténtalo de nuevo.';
      if (err.code === 1 && g.watchId !== null) { try { navigator.geolocation.clearWatch(g.watchId); } catch { } g.watchId = null; }
      actualizarGPSDOM();
    }, { enableHighAccuracy: true, maximumAge: 3000, timeout: 20000 });
  } catch (e) {
    g.error = 'No se pudo iniciar el GPS: ' + e.message;
  }
  actualizarGPSDOM();
}
function detenerGPSConductor() {
  const g = Estado.conductor.gps;
  if (g.watchId !== null) {
    try { navigator.geolocation.clearWatch(g.watchId); } catch { }
    g.watchId = null;
  }
  actualizarGPSDOM();
}
async function enviarUbicacion() {
  const c = Estado.conductor, g = c.gps, r = c.recorrido;
  if (!r || r.estado !== 'EN_CURSO' || !g.pos || g.enviando) return;
  if (Date.now() - g.pos.ts > 30000) return;
  g.enviando = true;
  try {
    await api(`/buses/${r.bus_id}/ubicacion`, { method: 'POST', body: { latitud: g.pos.lat, longitud: g.pos.lng, velocidad: Math.max(0, g.pos.speed || 0) }, silencioso: true });
    g.ultimoEnvio = new Date();
    g.error = null;
  } catch (e) {
    if (e.status !== 401) g.error = 'No se pudo enviar la ubicación: ' + e.message;
  } finally {
    g.enviando = false;
    actualizarGPSDOM();
    actualizarMapaConductor();
  }
}
function actualizarGPSDOM() {
  const c = Estado.conductor, g = c.gps, r = c.recorrido;
  const badge = document.getElementById('gps-badge'), linea = document.getElementById('gps-linea'), est = document.getElementById('gps-estado');
  if (!badge || !linea || !est) return;
  const error = g.error;
  const pausa = r && r.estado === 'INTERRUMPIDO';
  const transmitiendo = g.pos && g.watchId !== null && !error && !pausa;
  badge.className = 'bg ' + (error ? 'rd' : transmitiendo ? '' : pausa ? 'or' : 'gr');
  badge.textContent = error ? 'Revisar' : transmitiendo ? 'Transmitiendo' : pausa ? 'En pausa' : 'Esperando';
  linea.className = 'gps ' + (error ? 'bad' : transmitiendo ? '' : 'off');
  est.textContent = error ? 'GPS con problemas' : transmitiendo ? (r.estado === 'EN_CURSO' ? 'GPS activo · enviando cada 5 s' : 'GPS listo · recorrido en pausa') : g.pos ? 'Ubicación obtenida' : 'Obteniendo ubicación…';
  const lat = document.getElementById('gps-lat'), lng = document.getElementById('gps-lng'), pre = document.getElementById('gps-pre'), ult = document.getElementById('gps-ultimo');
  if (lat) lat.textContent = g.pos ? g.pos.lat.toFixed(6) : '—';
  if (lng) lng.textContent = g.pos ? g.pos.lng.toFixed(6) : '—';
  if (pre) pre.textContent = g.pos && g.pos.accuracy ? `± ${Math.round(g.pos.accuracy)} m` : '—';
  if (ult) ult.textContent = g.ultimoEnvio ? `${hora(g.ultimoEnvio.toISOString())} (${desde(g.ultimoEnvio)})` : 'Aún no se ha enviado';
  const err = document.getElementById('gps-error');
  if (err) { err.hidden = !error; err.textContent = error || ''; }
}

const ADMIN_TABS = [['resumen', 'Resumen'], ['rutas', 'Rutas'], ['paradas', 'Paradas'], ['buses', 'Buses'], ['conductores', 'Conductores'], ['avisos', 'Avisos']];

      </tbody></table></div></div>`}`
  };
}
async function crearConductor(ev) {
  ev.preventDefault();
  const nombre = document.getElementById('nc-nombre').value.trim();
  const correo = document.getElementById('nc-correo').value.trim();
  const password = document.getElementById('nc-password').value;
  const licencia = document.getElementById('nc-licencia').value.trim();
  if (!nombre || !correo || password.length < 8) return toast('Completa nombre, correo y contraseña de mínimo 8 caracteres', 'err');
  try {
    await api('/admin/conductores', { method: 'POST', body: { nombre, correo, password, licencia } });
    await cargarAdmin('conductores'); render();
    toast('Conductor creado', 'ok');
  } catch (e) { toast(e.message, 'err'); }
}
async function alternarConductor(id, activo) {
  try {
    await api(`/admin/conductores/${id}`, { method: 'PATCH', body: { activo: !!activo } });
    await cargarAdmin('conductores'); render();
    toast(activo ? 'Conductor activado' : 'Conductor desactivado', 'ok');
  } catch (e) { toast(e.message, 'err'); }
}

      <div class="tw" style="margin-top:10px"><table><thead><tr><th>Título</th><th>Mensaje</th><th>Publicado</th><th>Vigente hasta</th><th>Autor</th></tr></thead><tbody>
      ${a.avisos.map(x => `<tr><td><b>${esc(x.titulo)}</b></td><td style="min-width:220px">${esc(x.mensaje)}</td><td>${fechaHora(x.publicado_en)}</td><td>${fechaHora(x.vigente_hasta)}</td><td>${esc(x.admin || '')}</td></tr>`).join('')}
      </tbody></table></div></div>`}`

async function crearAviso(ev) {
  ev.preventDefault();
  const titulo = document.getElementById('na-titulo').value.trim();
  const mensaje = document.getElementById('na-mensaje').value.trim();
  const vigente_hasta = document.getElementById('na-vigencia').value;
  if (!titulo || !mensaje || !vigente_hasta) return toast('Completa el título, el mensaje y la fecha de vigencia', 'err');
  if (new Date(vigente_hasta) <= new Date()) return toast('La fecha de vigencia debe ser futura', 'err');
  try {
    await api('/avisos', { method: 'POST', body: { titulo, mensaje, vigente_hasta } });
    await cargarAdmin('avisos'); render();
    toast('Aviso publicado', 'ok');
  } catch (e) { toast(e.message, 'err'); }
}

let latidoId = null, tickLatido = 0;
function iniciarLatido() {
  if (latidoId) clearInterval(latidoId);
  tickLatido = 0;
  latidoId = setInterval(async () => {
    if (!Estado.sesion) return;
    const rol = Estado.sesion.usuario.rol;
    tickLatido++;
    try {
      if (rol === 'ESTUDIANTE' && Estado.tab === 'mapa' && Estado.rutaSel && Estado.paradaSel) {
        await refrescarBusesYETA();
        if (tickLatido % 6 === 0) await refrescarAlertasSilencioso();
      } else if (rol === 'CONDUCTOR' && Estado.conductor.recorrido) {
        await enviarUbicacion();
      }
    } catch { }
  }, 5000);
}
function detenerLatido() {
  if (latidoId) clearInterval(latidoId);
  latidoId = null;
}
async function refrescarAlertasSilencioso() {
  try {
    const previas = new Map(Estado.alertas.map(a => [a.id, a.estado]));
    const nuevas = await api('/alertas', { silencioso: true });
    if (!Array.isArray(nuevas)) return;
    const enviada = nuevas.find(a => previas.get(a.id) === 'ACTIVA' && a.estado === 'ENVIADA');
    Estado.alertas = nuevas;
    if (enviada) {
      const key = 'qb.aviso.' + enviada.id;
      if (!sessionStorage.getItem(key)) {
        sessionStorage.setItem(key, '1');
        toast(`🔔 Tu bus está por llegar a ${nombreParada(enviada.parada_id)}`, 'ok', 7000);
      }
      actualizarPanelEta();
    }
  } catch { }
}
async function activarPush() {
  const cfg = (typeof self !== 'undefined' && self.QUILLABUS_FIREBASE) || {};
  if (!cfg.config || !cfg.config.apiKey || !cfg.vapidKey) {
    return toast('Firebase no está configurado. Completa public/firebase-config.js y vuelve a desplegar.', 'err', 6500);
  }
  if (!('serviceWorker' in navigator) || !('Notification' in window)) return toast('Este navegador no soporta notificaciones push', 'err');
  try {
    const permiso = await Notification.requestPermission();
    if (permiso !== 'granted') return toast('No se concedió permiso para las notificaciones', 'err');
    const reg = await navigator.serviceWorker.register('/firebase-messaging-sw.js');
    const [appMod, msgMod] = await Promise.all([
      import('https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js'),
      import('https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging.js')
    ]);
    const fbApp = appMod.getApps().length ? appMod.getApps()[0] : appMod.initializeApp(cfg.config);
    const messaging = msgMod.getMessaging(fbApp);
    const token = await msgMod.getToken(messaging, { vapidKey: cfg.vapidKey, serviceWorkerRegistration: reg });
    if (!token) throw new Error('Firebase no devolvió un token');
    await api('/push/token', { method: 'POST', body: { token } });
    msgMod.onMessage(messaging, payload => {
      const n = payload.notification || {};
      toast((n.title ? n.title + ' · ' : '') + (n.body || 'Notificación recibida'), 'ok', 6000);
    });
    toast('Notificaciones push activadas', 'ok');
  } catch (e) {
    console.error(e);
    toast('No se pudieron activar las notificaciones: ' + e.message, 'err', 6500);
  }
}
function iniciar() {
  const tema = localStorage.getItem('qb.tema');
  if (tema) aplicarTema(tema);
  const modal = document.getElementById('modal');
  if (modal) modal.addEventListener('click', ev => { if (ev.target === modal) cerrarModal(); });
  document.addEventListener('keydown', ev => { if (ev.key === 'Escape') cerrarModal(); });
  window.addEventListener('online', () => toast('Conexión recuperada. Actualizando datos…', 'ok'));
  window.addEventListener('offline', () => toast('Sin conexión. La app reintentará automáticamente.', 'err', 5000));
  document.addEventListener('visibilitychange', () => {
    if (document.hidden || !Estado.sesion) return;
    const rol = Estado.sesion.usuario.rol;
    if (rol === 'ESTUDIANTE' && Estado.tab === 'mapa') refrescarBusesYETA();
    if (rol === 'CONDUCTOR') enviarUbicacion();
  });
  const sesion = leerSesion();
  if (sesion) {
    Estado.sesion = sesion;
    iniciarApp();
  } else {
    renderAuth();
  }
}
iniciar();
