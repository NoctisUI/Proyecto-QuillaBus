# Despliegue de QuillaBus en Render (web + PostgreSQL gestionado).
# 1) Sube el repositorio a GitHub.
# 2) Render > New > Blueprint y selecciona este archivo.
# 3) Al primer arranque, "npm run setup" crea las tablas y carga las paradas reales.
databases:
  - name: quillabus-db
    plan: free
    databaseName: quillabus
    user: quillabus

services:
  - type: web
    name: quillabus
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run setup && npm start
    healthCheckPath: /api/salud
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DEMO_PASSWORD
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: quillabus-db
          property: connectionString
