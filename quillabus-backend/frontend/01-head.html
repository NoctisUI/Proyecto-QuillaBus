<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00573F">
<meta name="description" content="QuillaBus: sigue los buses universitarios de Barranquilla en tiempo real, consulta paradas reales de Transmetro y recibe avisos de llegada.">
<title>QuillaBus · Tu bus en tiempo real</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#eaf1ed;--cd:#fff;--ink:#10201a;--mut:#5d7068;--g:#00573F;--g2:#003E2D;--go:#B8860B;--ln:#d5e0da;--mp:#dfe9e3;--rd:#c9d6ce;--rj:#C0392B;--ok:#e3f2ea;--okt:#00573F;--warn:#fbe5d0;--warnt:#a4530c;--sh:0 10px 30px #003e2d12;--r:18px}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1511;--cd:#15231d;--ink:#e6f0ea;--mut:#8fa59b;--g:#1f8a64;--g2:#0f4a38;--go:#e0a82e;--ln:#243a31;--mp:#102019;--rd:#1d3228;--rj:#e0584a;--ok:#173a2b;--okt:#6fd9aa;--warn:#3a2b17;--warnt:#f0bd73;--sh:0 10px 30px #0006}}
:root[data-theme="dark"]{--bg:#0c1511;--cd:#15231d;--ink:#e6f0ea;--mut:#8fa59b;--g:#1f8a64;--g2:#0f4a38;--go:#e0a82e;--ln:#243a31;--mp:#102019;--rd:#1d3228;--rj:#e0584a;--ok:#173a2b;--okt:#6fd9aa;--warn:#3a2b17;--warnt:#f0bd73;--sh:0 10px 30px #0006}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 Figtree,system-ui,-apple-system,sans-serif;min-height:100dvh;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4,.big,.brand,.lg2{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;letter-spacing:-.015em}
:focus-visible{outline:3px solid var(--go);outline-offset:2px}
img{max-width:100%}
#app{max-width:440px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg)}
#app.wide{max-width:1080px}
.hd{background:linear-gradient(165deg,var(--g2),var(--g));color:#fff;padding:calc(16px + env(safe-area-inset-top,0px)) 20px 48px;border-radius:0 0 30px 30px;position:relative;overflow:hidden}
.hd::after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:#ffffff10;right:-90px;top:-80px;pointer-events:none}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px;position:relative;z-index:1}
.brand{font-weight:800;font-size:20px;display:flex;align-items:center;gap:8px}
.brand::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--go);display:inline-block;transform:rotate(45deg)}
.acciones{display:flex;gap:7px;align-items:center;position:relative;z-index:1}
.gh{background:#ffffff26;color:#fff;border:1px solid #ffffff2e;border-radius:99px;padding:8px 13px;font-weight:600;font-size:14px;min-height:40px;transition:background .15s}
.gh:hover{background:#ffffff38}
.gh.icon{padding:8px 11px}
.hd h1{font-size:clamp(25px,7.2vw,33px);line-height:1.1;font-weight:800;position:relative;z-index:1}
.hd .sub{opacity:.85;font-size:14px;margin-top:6px;position:relative;z-index:1;max-width:38ch}
.usuario{margin-top:14px;display:inline-flex;align-items:center;gap:7px;background:#ffffff1c;border:1px solid #ffffff22;border-radius:99px;padding:5px 11px;font-size:12.5px;font-weight:600;position:relative;z-index:1}
.usuario i{width:7px;height:7px;border-radius:50%;background:#6fe0ab;display:block}
main{flex:1;padding:0 16px calc(96px + env(safe-area-inset-bottom,0px));margin-top:-30px;display:flex;flex-direction:column;gap:12px;position:relative;z-index:1}
main.simple{padding-bottom:32px}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.card.flat{box-shadow:none}
.card h2,.card h3{font-size:19px;line-height:1.2;margin-bottom:4px}
.card p{font-size:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.row>div>b,.row>div>.big{display:block}
.row.wrap{flex-wrap:wrap}
.row.start{justify-content:flex-start}
.col{display:flex;flex-direction:column;gap:10px}
small,.mut{color:var(--mut);font-size:13px}
strong,b{font-weight:700}
.big{font-size:clamp(42px,12vw,56px);line-height:1;font-weight:800;color:var(--g)}
.badge,.bg{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:700;background:var(--ok);color:var(--okt);white-space:nowrap}
.bg.gr{background:var(--ln);color:var(--mut)}
.bg.or{background:var(--warn);color:var(--warnt)}
.bg.rd{background:#f8d7d3;color:#8f1e13}
:root[data-theme="dark"] .bg.rd{background:#4a211d;color:#ff9e92}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .bg.rd{background:#4a211d;color:#ff9e92}}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.ch{flex:0 0 auto;min-height:44px;padding:0 15px;border-radius:13px;border:2px solid var(--ln);background:var(--cd);font-weight:700;font-size:14px;transition:transform .12s,border-color .12s}
.ch:active{transform:scale(.97)}
.ch.on{background:var(--c,var(--g));border-color:var(--c,var(--g));color:#fff}
.ch .dot{background:currentColor;width:7px;height:7px}
select,input,textarea{width:100%;min-height:48px;border-radius:12px;border:1.5px solid var(--ln);background:var(--bg);padding:10px 12px;transition:border-color .15s}
select:focus,input:focus,textarea:focus{border-color:var(--g);outline:none;box-shadow:0 0 0 3px #00573f1f}
input[type=color]{padding:4px;height:50px;cursor:pointer}
input[type=checkbox]{width:19px;height:19px;min-height:0;accent-color:var(--g);flex:none}
textarea{resize:vertical;min-height:90px}
label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
.row select{width:auto;max-width:200px;min-width:130px}
.pb{min-height:48px;border:0;border-radius:13px;background:var(--g);color:#fff;font-weight:700;padding:0 16px;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:filter .15s,transform .12s}
.pb:hover{filter:brightness(1.08)}
.pb:active{transform:scale(.98)}
.pb:disabled{background:var(--ok);color:var(--okt);cursor:not-allowed;filter:none}
.pb.sm{min-height:38px;font-size:13.5px;padding:0 12px;border-radius:10px}
.pb.ou{background:transparent;border:2px solid var(--g);color:var(--g)}
.pb.ou:disabled{border-color:var(--ln);color:var(--mut);background:transparent}
.pb.go{background:var(--go)}
.pb.rj{background:var(--rj)}
.pb.ghost{background:transparent;border:1.5px solid var(--ln);color:var(--ink)}
.pb.block{width:100%}
.icon-btn{background:none;border:0;min-width:44px;min-height:44px;color:var(--go);font-size:22px;display:inline-grid;place-items:center;border-radius:10px}
.icon-btn:hover{background:var(--bg)}
.link{background:none;border:0;color:var(--g);font-weight:700;padding:4px;font-size:13.5px;min-height:32px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:420px){.grid3{grid-template-columns:1fr 1fr}}
@media(max-width:360px){.grid2{grid-template-columns:1fr}}
.it{display:flex;gap:12px;align-items:center}
.it>div{flex:1;min-width:0}
.bar{width:6px;align-self:stretch;border-radius:6px;background:var(--c,var(--g));flex:none;min-height:44px}
.it b{display:block;overflow-wrap:anywhere}
.empty{border:1.5px dashed var(--ln);border-radius:var(--r);padding:22px 16px;text-align:center;color:var(--mut);font-size:14px;background:var(--cd)}
.notice{display:flex;gap:10px;align-items:flex-start;background:var(--warn);color:var(--warnt);border-radius:13px;padding:12px 14px;font-size:13.5px;font-weight:600}
.notice.ok{background:var(--ok);color:var(--okt)}
.notice.rd{background:#f8d7d3;color:#8f1e13}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .notice.rd{background:#4a211d;color:#ff9e92}}
:root[data-theme="dark"] .notice.rd{background:#4a211d;color:#ff9e92}
.sep{border:0;border-top:1px solid var(--ln);margin:2px 0}
.nv{position:sticky;bottom:0;z-index:500;display:flex;background:var(--cd);border-top:1px solid var(--ln);padding:6px 6px calc(8px + env(safe-area-inset-bottom,0px));max-width:440px;margin:0 auto;width:100%}
.nv button{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:var(--mut);font-size:11.5px;font-weight:600;min-height:56px;border-radius:12px;padding:5px 2px}
.nv button.on{color:var(--g);background:var(--ok)}
.nv svg{width:22px;height:22px}
.nv .bd{position:absolute;top:3px;right:calc(50% - 24px);background:var(--go);color:#fff;border-radius:99px;font-size:10px;font-style:normal;padding:1px 6px;font-weight:800}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none;position:sticky;top:0;z-index:450;background:var(--bg)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;min-height:40px;padding:0 14px;border-radius:11px;border:1.5px solid var(--ln);background:var(--cd);font-weight:600;font-size:13.5px;white-space:nowrap}
.tab.on{background:var(--g);color:#fff;border-color:var(--g)}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}
.kp .card b{font-size:32px;font-family:"Bricolage Grotesque",sans-serif;display:block;line-height:1.1;margin-top:4px}
.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:12px;align-items:start}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.tw{overflow-x:auto;margin:0 -4px;padding:0 4px}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:540px}
th{text-align:left;color:var(--mut);font-weight:600;padding:8px 7px;white-space:nowrap;border-bottom:1px solid var(--ln)}
td{padding:11px 7px;border-top:1px solid var(--ln);vertical-align:middle}
td .pb{margin:2px 3px 2px 0}
td select{min-height:36px;padding:5px 8px;font-size:13px;min-width:118px}
.tw+.tw{margin-top:8px}
.mapa-card{padding:0;overflow:hidden;position:relative}
.mapa-head{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--ln)}
.mapa-head b{display:block;font-size:15.5px;line-height:1.25}
.mapa-head small{display:block;margin-top:2px}
.mapbox{height:clamp(280px,46vh,430px);width:100%;background:var(--mp);z-index:0}
.mapa-error{height:100%;display:grid;place-items:center;text-align:center;padding:24px;color:var(--mut);font-size:14px}
.mapa-foot{padding:9px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;color:var(--mut);border-top:1px solid var(--ln)}
.leaflet-container{font:inherit;background:var(--mp)}
.leaflet-control-attribution{font-size:10px!important}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--cd);color:var(--ink)}
.leaflet-popup-content{font-size:13px;line-height:1.4;margin:10px 12px}
.pin-bus{width:34px;height:34px;border-radius:50%;background:var(--c,#00573F);color:#fff;display:grid;place-items:center;font-size:15px;border:3px solid #fff;box-shadow:0 3px 10px #0005}
.pin-parada{width:16px;height:16px;border-radius:50%;background:#fff;border:4px solid var(--c,#00573F);box-shadow:0 1px 4px #0006;transition:transform .15s}
.pin-parada.sel{width:22px;height:22px;border-color:var(--go);background:var(--go);box-shadow:0 0 0 5px #b8860b33}
.pin-user{width:20px;height:20px;border-radius:50%;background:#2fbf7f;border:4px solid #fff;box-shadow:0 0 0 7px #2fbf7f33,0 2px 6px #0005;animation:pl 1.6s infinite}
@keyframes pl{50%{box-shadow:0 0 0 12px #2fbf7f00,0 2px 6px #0005}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
.ts{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(8px);background:var(--g2);color:#fff;border-radius:14px;padding:12px 16px;max-width:min(90vw,420px);font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:1200;box-shadow:0 8px 30px #0004;text-align:center}
.ts.on{opacity:1;transform:translateX(-50%) translateY(0)}
.ts.err{background:var(--rj)}
.ts.ok{background:var(--g)}
.modal{position:fixed;inset:0;background:#00150e99;backdrop-filter:blur(3px);z-index:1000;display:flex;align-items:flex-end;justify-content:center;padding:14px}
.modal[hidden]{display:none}
.modal-card{background:var(--cd);border:1px solid var(--ln);border-radius:22px;max-width:600px;width:100%;max-height:88dvh;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 24px 80px #0006}
@media(min-width:700px){.modal{align-items:center}}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:-18px;background:var(--cd);padding:6px 0;z-index:2;border-bottom:1px solid var(--ln)}
.modal-head h2{font-size:21px}
.modal-head button{background:none;border:0;font-size:28px;min-width:44px;min-height:44px;color:var(--mut);border-radius:10px}
.check-list{max-height:300px;overflow:auto;display:grid;gap:3px;background:var(--bg);border:1px solid var(--ln);border-radius:12px;padding:7px}
.check-list label{flex-direction:row;align-items:center;font-weight:500;padding:8px;border-radius:8px;cursor:pointer;font-size:14px}
.check-list label:hover{background:var(--cd)}
.check-list small{margin-left:auto}
.skel{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--ln),var(--bg),var(--ln));background-size:200% 100%;animation:sh 1.4s infinite}
@keyframes sh{to{background-position:-200% 0}}
.auth{max-width:440px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:calc(26px + env(safe-area-inset-top,0px)) 18px calc(30px + env(safe-area-inset-bottom,0px));gap:14px;background:var(--bg)}
.auth-logo{font-size:44px;font-weight:800;color:var(--g);line-height:1;letter-spacing:-.04em}
.auth-logo span{color:var(--go)}
.auth .lead{font-size:15px;color:var(--mut);max-width:34ch;margin-top:-4px}
.auth-card{background:var(--cd);border:1px solid var(--ln);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:13px;box-shadow:var(--sh)}
.seg{display:flex;background:var(--ln);border-radius:13px;padding:4px}
.seg button{flex:1;min-height:42px;border:0;border-radius:10px;background:none;font-weight:600;font-size:14px}
.seg .on{background:var(--g);color:#fff}
.demo{display:flex;gap:6px;flex-wrap:wrap}
.demo button{border:1px solid var(--ln);background:var(--bg);border-radius:99px;padding:6px 11px;font-size:12px;font-weight:600;min-height:34px}
.demo button:hover{border-color:var(--g)}
.auth-foot{text-align:center;font-size:12px;color:var(--mut);line-height:1.5}
.gps{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13.5px}
.gps i{width:10px;height:10px;border-radius:50%;background:#2fbf7f;animation:pl2 1.2s infinite;flex:none}
.gps.off i{background:var(--mut);animation:none}
.gps.bad i{background:var(--rj);animation:none}
@keyframes pl2{50%{opacity:.3}}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13.5px}
.kv dt{color:var(--mut)}
.kv dd{font-weight:600;text-align:right;overflow-wrap:anywhere}
details summary{cursor:pointer;font-weight:700;font-size:13.5px;color:var(--g);padding:6px 0;min-height:34px}
details[open] summary{margin-bottom:4px}
.stop-list{display:grid;gap:2px}
.stop-item{display:flex;align-items:center;gap:9px;padding:8px 4px;border-top:1px solid var(--ln);font-size:13.5px}
.stop-item .n{width:23px;height:23px;border-radius:50%;background:var(--ok);color:var(--okt);display:grid;place-items:center;font-size:11px;font-weight:800;flex:none}
.stop-item button{background:none;border:0;text-align:left;flex:1;min-height:36px;font-weight:500}
.stop-item .eta{margin-left:auto;color:var(--mut);font-size:12px;white-space:nowrap}
.progress{height:4px;border-radius:99px;background:var(--ln);overflow:hidden}
.progress i{display:block;height:100%;background:var(--go);border-radius:99px;transition:width .5s}
</style>
</head>
<body>
